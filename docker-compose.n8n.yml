name: n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Zurich
      - TZ=Europe/Zurich
      # Local classroom use only - no auth, no encryption-key prompt noise
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=classroom-dev-key-change-me
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Lets the Code node use libraries if students want to chunk manually
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files          # drop PDFs/markdown here to ingest from disk
    networks:
      - ragnet
    # No depends_on: qdrant and ollama live in their own compose projects.
    # Start them first (see README) - n8n only needs them at workflow run time.

volumes:
  n8n_data:

networks:
  # Shared by all three compose files. The explicit `name:` keeps it as plain
  # `ragnet` (not `<project>_ragnet`), so whichever file starts first creates it
  # and the others attach to the same one. `down` leaves it alone while another
  # service is still attached.
  ragnet:
    name: ragnet
